name: test
on:
  pull_request:
  push:
    branches:
      - main
      - develop
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: 26
          cache: yarn
      - name: Install
        run: yarn install --frozen-lockfile
      - name: Generate GraphQL types
        run: yarn codegen
      - name: Lint
        run: yarn lint
      - name: Component tests
        run: yarn test
      - name: Build
        run: yarn build
