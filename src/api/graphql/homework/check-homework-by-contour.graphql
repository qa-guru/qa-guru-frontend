mutation checkHomeWorkByContour($homeWorkId: ID!) {
  checkHomeWorkByContour(homeWorkId: $homeWorkId) {
    id
    status
    contourHandle
    contourCheckVerdict
    contourCheckComment
    contourCheckedAt
    contourEvidence {
      found
      handle
      contourStatus
      githubUrl
      githubSlug
      jenkinsUrl
      jenkinsJob
      lastBuild
      testopsUrl
      allureUrl
    }
  }
}
