query homeWork($homeWorkId: ID!) {
  homeWork(id: $homeWorkId) {
    id
    lecture {
      id
      subject
      contentHomeWork
    }
    answer
    status
    training {
      techStack
    }
    student {
      id
      firstName
      avatar
      lastName
      rating {
        rating
      }
    }
    mentor {
      id
      firstName
      avatar
      lastName
      rating {
        rating
      }
    }
    creationDate
    startCheckingDate
    endCheckingDate
    contourHandle
    contourCheckVerdict
    contourCheckComment
    contourCheckedAt
    contourEvidence {
      found
      handle
      contourStatus
      githubUrl
      githubSlug
      jenkinsUrl
      jenkinsJob
      lastBuild
      testopsUrl
      allureUrl
    }
  }
}
